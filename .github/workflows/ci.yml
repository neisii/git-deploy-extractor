name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # release.yml과 같은 액션 버전(v7)을 쓴다 — 그쪽 주석에 남긴 확인
      # 근거(breaking change 없음)를 그대로 따른다.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # RT-01(vitest) 순수 함수 테스트. E2E(test:e2e, RT-02)는 Electron
      # 창을 띄워야 해서(리눅스 러너엔 xvfb 필요) 별도 후속 과제로 남긴다
      # — RT-03 범위는 typecheck·lint·test 3개다.
      - run: npm test
